name: automerge

# レビュー係 (別セッションの Claude) が承認し、CI が通った claude/issue-* の PR をマージする。
# 人が止めたいときは PR に hold を付ける。needs-fix が付いている間は触らない。
# check は head に対する run でよい。bot の push では pull_request の run が立たないため。

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_run:
    workflows: [check]
    types: [completed]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: 承認済みで CI が通った PR をマージする
        id: merge
        run: |
          set -euo pipefail
          merged=0
          # 途中で失敗しても、それまでにマージした件数を次のステップに渡す
          trap 'echo "merged=$merged" >> "$GITHUB_OUTPUT"' EXIT
          main_date=$(gh api "repos/$REPO/commits/main" --jq .commit.committer.date)
          for n in $(gh api "repos/$REPO/pulls?state=open&per_page=50" --jq '.[] | select(.head.ref|startswith("claude/issue-")) | select(.draft|not) | .number'); do
            pr=$(gh api "repos/$REPO/pulls/$n")
            sha=$(jq -r .head.sha <<<"$pr")
            labels=$(jq -r '[.labels[].name]|join(",")' <<<"$pr")
            case ",$labels," in *,hold,*|*,needs-fix,*) echo "#$n: skip ($labels)"; continue;; esac
            case ",$labels," in *,approved,*) ;; *) echo "#$n: not approved"; continue;; esac
            # 承認コメントは、リポジトリの所有者 (レビュー係はその権限で動く) が投稿し、今の head の sha を指すものだけを認める
            ok=$(gh api "repos/$REPO/issues/$n/comments?per_page=100" | jq --arg sha "$sha" --arg owner "$OWNER" '[.[] | select(.user.login == $owner) | select(.body|contains("<!-- polaris-review: approve sha=" + $sha + " -->"))] | length')
            if [ "$ok" -eq 0 ]; then
              echo "#$n: no valid approval for head $sha; removing stale approved label"
              gh api -X DELETE "repos/$REPO/issues/$n/labels/approved" >/dev/null 2>&1 || true
              continue
            fi
            # main と衝突した PR は check もマージもできないので、開発ループに戻す。needs-fix が付くので次の回からは飛ばされる
            if [ "$(jq -r .mergeable_state <<<"$pr")" = "dirty" ]; then
              gh api -X DELETE "repos/$REPO/issues/$n/labels/approved" >/dev/null 2>&1 || true
              gh api -X POST "repos/$REPO/issues/$n/labels" -f 'labels[]=needs-fix' >/dev/null
              body=$(printf '<!-- polaris-review: changes sha=%s -->\n%s' "$sha" "main と衝突している。git merge origin/main で解消し、検査を通して push する。コードの指摘ではない。")
              gh api -X POST "repos/$REPO/issues/$n/comments" -f body="$body" >/dev/null || echo "#$n: comment failed (ignored)"
              echo "#$n: conflicts with main; sent back with needs-fix"
              continue
            fi
            runs=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" --jq '[.check_runs[] | select(.name!="merge")]')
            total=$(jq 'length' <<<"$runs")
            bad=$(jq '[.[] | select(.conclusion!="success")] | length' <<<"$runs")
            { [ "$total" -gt 0 ] && [ "$bad" -eq 0 ]; } || { echo "#$n: checks not green ($bad of $total)"; continue; }
            # head に対する check が、今の main の先頭より新しいこと。古ければ再実行して次の回に回す
            # bot の push 後は workflow_dispatch の run しか無く、それは pull_requests を持たないので、pull_requests では絞らない
            fresh=$(jq --arg d "$main_date" '[.[] | select(.started_at > $d)] | length' <<<"$runs")
            if [ "$fresh" -eq 0 ]; then
              run_id=$(jq -r '[.[] | select((.pull_requests|length) > 0)][0].html_url // empty' <<<"$runs" | sed -E 's#.*/actions/runs/([0-9]+).*#\1#')
              if [ -n "$run_id" ]; then
                gh api -X POST "repos/$REPO/actions/runs/$run_id/rerun" >/dev/null 2>&1 || true
              else
                branch=$(jq -r .head.ref <<<"$pr")
                gh workflow run check.yml --ref "$branch" --repo "$REPO" >/dev/null 2>&1 || true
              fi
              echo "#$n: check is older than main; re-running check"
              continue
            fi
            state=$(jq -r .mergeable_state <<<"$pr")
            case "$state" in clean|unstable) ;; *) echo "#$n: mergeable_state=$state"; continue;; esac
            branch=$(jq -r .head.ref <<<"$pr")
            # sha を渡すと、確認した head から動いていたら 409 で拒否される (未承認のコミットを巻き込まない)
            gh api -X PUT "repos/$REPO/pulls/$n/merge" -f merge_method=squash -f sha="$sha" >/dev/null || { echo "#$n: head moved since approval, skip"; continue; }
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null || true
            echo "#$n: merged"
            merged=$((merged+1))
            gh api -X POST "repos/$REPO/issues/$n/comments" -f body="レビュー係の承認と CI が揃ったので自動でマージした (${sha:0:7})。" >/dev/null || echo "#$n: comment failed (ignored)"
            # API 経由のマージでは本文の Closes #N が効かないことがあるので、参照している Issue をここで閉じる
            for issue in $(jq -r '.body // ""' <<<"$pr" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' | sort -u); do
              if [ "$(gh api "repos/$REPO/issues/$issue" --jq .state)" = "open" ]; then
                gh api -X PATCH "repos/$REPO/issues/$issue" -f state=closed -f state_reason=completed >/dev/null && echo "#$n: closed #$issue" || echo "#$n: could not close #$issue (ignored)"
              fi
            done
            # 1 回の実行で 1 件だけ。main が進むので、残りは次の回に新しい check で判定する
            break
          done
      - name: マージ済みの PR が指す Issue の閉じ忘れを閉じる
        if: always()
        run: |
          set -uo pipefail
          closed=0
          for issue in $(gh api "repos/$REPO/pulls?state=closed&sort=updated&direction=desc&per_page=50" | jq -r '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | reverse | .[:20][] | .body // ""' | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' | sort -un); do
            [ "$closed" -ge 5 ] && break
            # PR 番号を指していることもあるので、Issue で open のものだけを閉じる
            info=$(gh api "repos/$REPO/issues/$issue" --jq '[.state, (has("pull_request")|tostring)] | join(",")' 2>/dev/null) || continue
            [ "$info" = "open,false" ] || continue
            # 人が開き直した Issue は未完了の作業なので閉じない
            reopened=$(gh api "repos/$REPO/issues/$issue/events?per_page=100" --jq '[.[] | select(.event=="reopened")] | length' 2>/dev/null) || continue
            [ "$reopened" -eq 0 ] || { echo "skip #$issue (reopened)"; continue; }
            if gh api -X PATCH "repos/$REPO/issues/$issue" -f state=closed -f state_reason=completed >/dev/null; then
              echo "closed #$issue"
              closed=$((closed+1))
            else
              echo "could not close #$issue (ignored)"
            fi
          done
      - name: マージがあれば Pages をデプロイする
        if: always() && steps.merge.outputs.merged != '' && steps.merge.outputs.merged != '0'
        run: gh workflow run deploy-pages.yml --ref main --repo "$REPO"
